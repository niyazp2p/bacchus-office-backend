[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Async PostgreSQL connection placeholder; dynamically overridden by alembic/env.py
sqlalchemy.url = postgresql+asyncpg://postgres:niyaz2004@localhost:5433/bacchus_office_db

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S